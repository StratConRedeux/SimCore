name: Swift bindings

on:
  push:
    paths:
      - "crates/**"
      - "include/**"
      - "scripts/**"
      - "bindings/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "crates/**"
      - "include/**"
      - "scripts/**"
      - "bindings/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - ".github/workflows/swift.yml"

permissions:
  contents: read

jobs:
  test:
    # iOS 27 SDK needed; xcode-27 is a GitHub preview image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
          swift --version
      - name: Validate root manifest
        # Offline: loads Package.swift and checks its target paths, without fetching the release
        # asset it points at (dump-package alone would miss a broken path).
        run: swift package describe > /dev/null
      - name: Build XCFramework
        run: scripts/build-xcframework.sh
      - name: Swift tests (macOS)
        working-directory: bindings/swift
        run: swift test
      - name: Root manifest tests (macOS, local zip)
        # Builds and tests the root manifest itself, with the binary target swapped for this zip.
        run: |
          ditto -c -k --keepParent build/SimCore.xcframework build/SimCore.xcframework.zip
          scripts/check-root-manifest.sh build/SimCore.xcframework.zip
      - name: Build tests for iOS
        # Apple Silicon simulators only; the XCFramework has no x86_64 simulator slice.
        working-directory: bindings/swift
        run: xcodebuild build-for-testing -scheme SimCoreKit-Package -destination 'generic/platform=iOS Simulator' EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO -quiet
